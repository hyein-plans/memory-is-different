name: Install approved HD star-candy artwork
on:
  push:
    branches: [main]
    paths:
      - 'memory_is_different_hd_assets.zip'
permissions:
  contents: write
jobs:
  install-hd-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HD files and install exact asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          archive = Path('memory_is_different_hd_assets.zip')
          required = [
              'assets/hero/star-candy-party.webp',
              'assets/facts/fact-01-party-photo.webp',
              'assets/facts/fact-02-sound.webp',
              'assets/memory/star-candy-jar.webp',
              'assets/memory/red-ribbon-cake-box.webp',
              'assets/memory/handbell.webp',
              'assets/memory/glass-and-spoon.webp'
          ]
          optional = ['assets/memory/silver-tray.webp','assets/memory/moonlit-window.webp']
          with ZipFile(archive) as z:
              damaged = z.testzip()
              if damaged:
                  raise ValueError('Archive corruption: ' + damaged)
              if any(n not in z.namelist() for n in required):
                  raise ValueError('Missing required asset(s)')
              for n in required + [o for o in optional if o in z.namelist()]:
                  b = z.read(n)
                  if len(b) < 12000 or b[:4] != b'RIFF' or b[8:12] != b'WEBP':
                      raise ValueError('Not a valid large WebP asset: '+n)
                  p = Path(n)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(b)
                  print('Installed',n,len(b),'bytes')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='src="assets/hero/star-candy-party.webp?v=4" alt="파란 리본'
          if marker not in s:
              raise ValueError('Could not locate FACT 01 temporary picture')
          s=s.replace(marker,'src="assets/facts/fact-01-party-photo.webp?v=hd1" alt="파란 리본',1)
          s=s.replace('assets/hero/star-candy-party.webp?v=4','assets/hero/star-candy-party.webp?v=hd1')
          s=s.replace('assets/facts/fact-02-sound.webp?v=4','assets/facts/fact-02-sound.webp?v=hd1')
          s=s.replace('?v=3','?v=hd1')
          if 'src="assets/facts/fact-01-party-photo.webp?v=hd1"' not in s:
              raise ValueError('FACT 01 high quality image path not applied')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish improved site and HD images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if ! git diff --cached --quiet; then
            git commit -m "Install original HD hero, FACT, and memory illustrations"
            git push
          else
            echo "Already up to date"
          fi
